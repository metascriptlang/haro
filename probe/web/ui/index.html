<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Haro web probe</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
  }
  #canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  const p = new URLSearchParams(location.search);
  const app = p.get('app') || 'neonRows';
  const dir = p.has('wgpu') ? 'wgpu' : 'gl';
  window.voidLog = [];
  window.Module = {
    canvas: document.getElementById('canvas'),
    locateFile: (path) => dir + '/' + path,
    print: (t) => { window.voidLog.push(t); console.log(t); },
    printErr: (t) => { window.voidLog.push('ERR ' + t); console.error(t); },
  };
  const s = document.createElement('script');
  s.src = dir + '/' + app + '.js';
  s.onerror = () => { window.voidLog.push('failed to load ' + s.src); };
  document.body.appendChild(s);
</script>
</body>
</html>
